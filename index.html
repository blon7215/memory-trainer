<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#f6f4fb;--card:#fff;--ink:#1f1a2e;--mut:#6b6580;--pri:#5b3fc4;--pri2:#ece6ff;--ok:#1f8a4c;--bad:#c0392b;--warn:#b7791f;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#15121f;--card:#221d31;--ink:#eee9fa;--mut:#a59fb9;--pri:#9b84ff;--pri2:#2e2648}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
header{position:sticky;top:0;background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header h1{font-size:18px;margin:0}
.streak{font-size:14px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px}
main{max-width:640px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--pri2);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 2px;font-size:11px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h2{font-size:20px;margin:6px 0 10px}h3{font-size:16px;margin:4px 0 8px}
.mut{color:var(--mut);font-size:14px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;cursor:pointer;min-height:44px}
button.sec{background:var(--pri2);color:var(--ink)}
button.ghost{background:none;color:var(--pri);padding:6px 8px;min-height:0}
button.small{padding:6px 10px;min-height:34px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.g1{background:var(--bad)}.g3{background:var(--warn)}.g4{background:var(--ok)}.g5{background:#2b6cb0}
.bar{height:8px;background:var(--pri2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}

ul.clean{list-style:none;padding:0;margin:0}ul.clean li{padding:8px 0;border-bottom:1px solid var(--pri2)}
img.face{width:72px;height:72px;object-fit:cover;border-radius:12px}
img.facebig{max-width:180px;max-height:180px;border-radius:14px;display:block;margin:8px auto}

header .hb{background:rgba(255,255,255,.2);color:#fff;min-height:40px;min-width:40px;padding:6px 12px;font-size:15px;border-radius:99px}
.hdr-r{display:flex;gap:6px;align-items:center}
button.xl{display:block;width:100%;min-height:56px;font-size:18px;margin-top:10px}
.tour{min-height:62vh;display:flex;flex-direction:column;justify-content:center}.tour h2{font-size:24px}.tour p,.tour li{font-size:17px}.tour li{padding:5px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 12px}.dots i{width:10px;height:10px;border-radius:10px;background:var(--pri2)}.dots i.on{background:var(--pri)}
.prompt{font-size:17px;font-weight:600;margin:10px 0 8px}
.qa{display:flex;gap:8px;margin-top:10px}.qa button{flex:1;min-height:50px}
.grades button{min-height:56px}
input{min-height:48px;font-size:17px}

.chip{background:var(--pri2);color:var(--ink);border-radius:99px;padding:6px 10px;min-height:40px;font-size:14px}.chip.on{background:#d9f3e3;color:#17663a}
.spk{float:right;margin-left:8px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.tgrid .card{margin:0;text-align:center}
details.card summary{cursor:pointer;min-height:40px;display:flex;align-items:center}

<body>
<header><h1 id="ttl">Memory Trainer</h1><div class="hdr-r"><span class="streak" id="streak">🔥 0</span><button class="hb" id="hq" aria-label="How to use" title="How to use">?</button><button class="hb" id="hh">Help</button></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
"use strict";
/* ================= Data & helpers ================= */
const KEY='memtrainer.v1';
const SKILLS={names:'Names & faces',palace:'Places & palaces',numbers:'Numbers (major system)',dates:'Dates & times'};
const SKILL_LESSON={names:'names',palace:'palace',numbers:'major',dates:'dates'};
const DEFAULT_MAJOR="sauce suit sun sumo sewer seal sash sock sofa soap toes toad tin tomb tire towel dish duck dove tub nose net nun gnome Nero nail notch neck knife knob mouse mat moon mummy mower mule match mug movie map rose rat rain ram rower roll roach rock roof rope lace lid lion lamb lure lily leash log lava lip cheese sheet chain jam chair jail judge chalk chef ship case cat coin comb car coal cage cake cave cub vase foot fan foam fire file fish fog fife fob bus bat bone bomb bear bell beach book beef baby".split(' ');
const pad2=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let NOW=()=>Date.now();
function today(){const d=new Date(NOW());return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function median(a){if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').trim();}

function freshState(){
  const major={};DEFAULT_MAJOR.forEach((w,i)=>major[pad2(i)]=w);
  const skills={};Object.keys(SKILLS).forEach(k=>skills[k]={level:1,log:[],sinceChange:0});
  return {v:1,cards:[],palaces:[],major,skills,lessonsDone:{},streak:{count:0,best:0,last:null},
    adaptLog:[],settings:{minutes:10},sessions:[],lastBackup:null,lastWarmupMsg:'',onboarded:false,starterDone:false,groups:[],timedLog:[]};
}
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||freshState();}catch(e){S=freshState();}
  const f=freshState();for(const k in f)if(S[k]===undefined)S[k]=f[k];
  for(const k in SKILLS)if(!S.skills[k])S.skills[k]=f.skills[k];
  S.cards.forEach(c=>{if(c.seen===undefined)c.seen=c.reps>0||c.deck==='numbers';});
  S.palaces.forEach(p=>p.loci.forEach(l=>{if(l.seen===undefined)l.seen=false;}));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alert('Storage is full. Export a backup and remove some photos.');}}

/* ================= Major system ================= */
const MAJOR_KEY=[['0','s, z, soft c'],['1','t, d, th'],['2','n'],['3','m'],['4','r'],['5','l'],['6','j, sh, ch, soft g'],['7','k, hard c, hard g, q'],['8','f, v, ph'],['9','p, b']];
// approximate phonetic encoder: word -> digits (vowels, w, h, y ignored; double letters count once)
function majorEncode(word){
  let w=norm(word).replace(/ /g,''),out='',i=0,prev='';
  const push=(d)=>{if(d!==prev)out+=d;prev=d;};
  while(i<w.length){
    const c=w[i],n=w[i+1]||'',t3=w.substr(i,3),t2=w.substr(i,2);
    if(t3==='tch'){push('6');i+=3;continue;}
    if(t2==='sh'||t2==='ch'){push('6');i+=2;continue;}
    if(t2==='th'){push('1');i+=2;continue;}
    if(t2==='ph'){push('8');i+=2;continue;}
    if(t2==='ck'){push('7');i+=2;continue;}
    if(t2==='gh'){prev='';i+=2;continue;}
    if((t2==='kn'||t2==='gn')&&i===0){i+=1;continue;}
    if(t2==='dg'){push('6');i+=2;continue;}
    if(t2==='lk'&&w[i-1]==='a'){i+=1;continue;}
    if(t2==='mb'&&i+2===w.length){push('3');i+=2;continue;}
    const map={s:'0',z:'0',t:'1',d:'1',n:'2',m:'3',r:'4',l:'5',j:'6',k:'7',q:'7',f:'8',v:'8',p:'9',b:'9'};
    if(c==='c'){push('eiy'.includes(n)?'0':'7');i++;continue;}
    if(c==='g'){push('ei'.includes(n)&&i+1<w.length&&w.length>3?'6':'7');i++;continue;}
    if(c==='x'){push('7');push('0');i++;continue;}
    if(map[c]){push(map[c]);i++;continue;}
    prev='';i++; // vowel / w / h / y separates
  }
  return out;
}
function majorOk(num,answer){const a=norm(answer);if(!a)return false;
  const listed=norm(S.major[num]||'');if(a===listed)return true;
  return majorEncode(a)===num;}
function numberToWords(digits){digits=String(digits).replace(/\D/g,'');const chunks=[];
  for(let i=0;i<digits.length;i+=2){let c=digits.substr(i,2);chunks.push(c.length===2?{c,w:S.major[c]}:{c,w:S.major['0'+c]+' (single '+c+': use 0'+c+')'});}
  return chunks;}
function dateToChunks(dstr,tstr){ // yyyy-mm-dd, hh:mm
  const out=[];if(dstr){const [y,m,d]=dstr.split('-');out.push({label:'Day',c:d,w:S.major[d]},{label:'Month',c:m,w:S.major[m]},{label:'Year',c:y.slice(2),w:S.major[y.slice(2)]});
    if(y.slice(0,2)!=='20')out.push({label:'Century',c:y.slice(0,2),w:S.major[y.slice(0,2)]});}
  if(tstr){const [h,mi]=tstr.split(':');out.push({label:'Hour',c:h,w:S.major[h]},{label:'Minute',c:mi,w:S.major[mi]});}
  return out;}

/* ================= SM-2 with adaptive multiplier ================= */
function newCard(deck,front,back,extra){return {id:uid(),deck,front,back,hint:(extra&&extra.hint)||'',extra:extra||{},ef:2.5,reps:0,ivl:0,due:today(),lapses:0,created:NOW(),seen:false};}
function sm2(card,q,mult){
  mult=mult||1;
  if(q<3){card.reps=0;card.ivl=1;card.lapses++;}
  else{card.reps++;
    if(card.reps===1)card.ivl=1;else if(card.reps===2)card.ivl=mult<1?3:6;else card.ivl=Math.round(card.ivl*card.ef);
    card.ivl=Math.max(1,Math.round(card.ivl*mult));}
  card.ef=Math.max(1.3,card.ef+0.1-(5-q)*(0.08+(5-q)*0.02));
  card.due=today()+card.ivl;card.last=NOW();return card;}

/* ================= Adaptive engine ================= */
function record(skill,ok,ms){const sk=S.skills[skill];if(!sk)return;
  sk.log.push({t:NOW(),ok:ok?1:0,ms:Math.round(ms||0)});if(sk.log.length>80)sk.log=sk.log.slice(-80);sk.sinceChange++;}
function profile(skill){
  const sk=S.skills[skill],L=sk.log,n=L.length,last20=L.slice(-20),r10=L.slice(-10),p10=L.slice(-20,-10);
  const acc=a=>a.length?a.reduce((s,x)=>s+x.ok,0)/a.length:null;
  const a20=acc(last20),ar=acc(r10),ap=acc(p10);
  const msR=median(r10.map(x=>x.ms)),msP=median(p10.map(x=>x.ms));
  const slowing=p10.length>=5&&msP>0&&msR>msP*1.3;
  const speeding=p10.length>=5&&msP>0&&msR<msP*0.85;
  let mode='steady',why='';
  if(n<6){mode='steady';why='Still getting to know you here — a few more answers and I’ll start tuning.';}
  else if(a20<0.7){mode='support';why=`Accuracy is ${Math.round(a20*100)}% (under 70%), so I’m slowing down: fewer new items, shorter gaps between reviews, hints and the worked example come back, and items are broken into smaller chunks.`;}
  else if(slowing&&a20<0.85){mode='support';why=`Answers are taking longer than before (${(msR/1000).toFixed(1)}s vs ${(msP/1000).toFixed(1)}s), so I’m easing off and adding a warm-up.`;}
  else if(a20>=0.85&&!slowing){mode='stretch';why=`Accuracy is ${Math.round(a20*100)}%${speeding?' and you’re getting faster':''}, so I’m stretching you: longer gaps between reviews, more new items and harder versions.`;}
  else {mode='steady';why=`Accuracy is ${Math.round(a20*100)}% — a good learning zone, so the pace stays the same.`;}
  const trend=(ar!=null&&ap!=null)?(ar-ap):0;
  return {skill,n,acc:a20,accRecent:ar,trend,msRecent:msR,msPrior:msP,slowing,speeding,mode,why,level:sk.level};
}
const MODE_PARAMS={support:{mult:0.7,newItems:2,drillCount:3,hint:true,chunk:true},steady:{mult:1,newItems:5,drillCount:5,hint:false,chunk:false},stretch:{mult:1.2,newItems:8,drillCount:7,hint:false,chunk:false}};
function params(skill){return MODE_PARAMS[profile(skill).mode];}
function overallMode(){const ps=Object.keys(SKILLS).map(profile).filter(p=>p.n>=6);
  if(!ps.length)return 'steady';const sup=ps.filter(p=>p.mode==='support').length,str=ps.filter(p=>p.mode==='stretch').length;
  if(sup>ps.length/2)return 'support';if(str>=Math.ceil(ps.length/2)&&sup===0)return 'stretch';return 'steady';}
function adaptLog(skill,text){S.adaptLog.unshift({t:NOW(),skill,text});S.adaptLog=S.adaptLog.slice(0,40);}
// level changes, called at end of each session
function applyAdaptation(){const changes=[];
  for(const k in SKILLS){const sk=S.skills[k],p=profile(k);if(sk.sinceChange<10||p.n<10)continue;
    if(p.acc>=0.9&&!p.slowing&&sk.level<5){sk.level++;sk.sinceChange=0;const t=`Levelled up to ${sk.level}: ${Math.round(p.acc*100)}% over your last ${Math.min(20,p.n)} answers. ${levelDesc(k,sk.level)}`;adaptLog(k,t);changes.push({k,t});}
    else if(p.acc<0.6&&sk.level>1){sk.level--;sk.sinceChange=0;const t=`Eased back to level ${sk.level} so it feels manageable again (${Math.round(p.acc*100)}% recently). ${levelDesc(k,sk.level)}`;adaptLog(k,t);changes.push({k,t});}
  }
  return changes;}
function levelDesc(k,l){return ({
  numbers:['','Numbers 00–19.','Numbers 00–49.','Full 00–99.','00–99 both ways (word → number too).','4-digit numbers as two images, on the clock.'],
  dates:['','Day of the month only.','Day + month.','Full date (day, month, year).','Full date plus a time.','Full date + time, on the clock.'],
  names:['','Name from face/feature, with hook hints.','Name from face/feature.','Name plus where you met.','Both directions (name → face/feature too).','Both directions, on the clock.'],
  palace:['','Walk the first 5 loci in order.','Walk up to 10 loci in order.','Whole palace in order.','Whole palace backwards.','Random loci, on the clock.']
})[k][l]||'';}
const ENCOURAGE=["Tricky ones are where the learning happens — that’s your brain doing the work.","Slower is fine. Accuracy first, speed comes by itself.","You’re rebuilding a skill, not taking a test. Let’s warm up with a few easy wins.","Every miss today is a card that comes back sooner — that’s the system working for you.","Short and steady beats long and stressful. Today is a lighter session."];
const PRAISE=["Nice — you’re ready for a bit more.","That’s strong recall. Stretching you a little.","Your memory is getting faster. Keep the streak going!"];

/* ================= Drill generators (level-aware, learned items only) ================= */
const STARTER=[['Eggs','A giant egg wearing sunglasses rolls down your driveway.'],['Keys','Your keys hang from the front door like wind chimes, jangling loudly.'],['Umbrella','An umbrella pops open in the kitchen and rains all over the bench.'],['Stamps','Postage stamps are stuck all over a very annoyed cat.'],['Basil','A basil plant is growing out of your shoe. You can smell it.']];
function ensureStarter(){let cs=S.cards.filter(c=>c.deck==='everyday');
  if(cs.length<STARTER.length){S.cards=S.cards.filter(c=>c.deck!=='everyday');cs=STARTER.map((x,i)=>newCard('everyday',`Starter list · item ${i+1} of ${STARTER.length}`,x[0],{hint:x[1],n:i+1}));S.cards.push(...cs);save();}
  return cs.map(c=>c.id);}
function learnedNums(){return [...new Set(S.cards.filter(c=>c.deck==='numbers'&&c.seen).map(c=>c.front))].sort();}
function numsUnlocked(){return !!S.lessonsDone.major;}
function hasLearned(){return Object.keys(S.lessonsDone).length>0||S.cards.some(c=>c.reps>0);}
function skillOf(c){return c&&c.deck in SKILLS?c.deck:null;}
function numberTask(){const L=learnedNums();if(!L.length)return null;const sk=S.skills.numbers,p=params('numbers'),lvl=sk.level;
  const max=[0,20,50,100,100,100][lvl];let pool=L.filter(n=>+n<max);if(!pool.length)pool=L;const pick=()=>pool[rnd(pool.length)];
  if(lvl>=5&&!p.chunk&&pool.length>=2)return {type:'num4',a:pick(),b:pick(),timed:true};
  if(lvl>=4&&!p.chunk&&pool.length>=4&&Math.random()<0.4)return {type:'wordnum',n:pick()};
  return {type:'num',n:pick(),hint:p.hint};}
function dateTask(){if(!S.lessonsDone.dates)return null;const Ls=new Set(learnedNums());if(!Ls.size)return null;const lvl=S.skills.dates.level,p=params('dates');
  let parts=['Day'];if(lvl>=2)parts.push('Month');if(lvl>=3)parts.push('Year');if(lvl>=4)parts.push('Hour','Minute');
  if(p.chunk&&parts.length>1)parts=parts.slice(0,Math.max(1,parts.length-2)); // smaller chunks when struggling
  for(let k=0;k<80;k++){const d=new Date(2026,0,1+rnd(365*3));const y=d.getFullYear(),m=pad2(d.getMonth()+1),dd=pad2(d.getDate()),t=pad2(7+rnd(12))+':'+['00','15','30','45'][rnd(4)];
    const ch=dateToChunks(`${y}-${m}-${dd}`,parts.includes('Hour')?t:'').filter(c=>parts.includes(c.label));
    if(ch.every(c=>Ls.has(c.c)))return {type:'date',date:`${y}-${m}-${dd}`,time:t,parts,hint:p.hint,timed:lvl>=5};}
  return null;}
function palaceTasks(count){const pals=S.palaces.filter(p=>p.loci.some(l=>l.item&&l.seen));if(!pals.length)return [];
  const lvl=S.skills.palace.level,p=params('palace');const pal=pals[rnd(pals.length)];
  let loci=pal.loci.map((l,i)=>({l,i})).filter(x=>x.l.item&&x.l.seen);
  const cap=p.chunk?Math.min(5,[0,5,10,99,99,99][lvl]):[0,5,10,99,99,99][lvl];loci=loci.slice(0,cap);
  if(lvl===4&&!p.chunk)loci.reverse();if(lvl>=5&&!p.chunk)loci=shuffle(loci);
  return loci.slice(0,Math.max(count,3)).map(x=>({type:'locus',pid:pal.id,i:x.i,hint:p.hint}));}
const RECALL_TYPES=['review','num','wordnum','num4','date','locus','listRecall'];
const STUDY_TYPES=['study','studyLocus','learnNums','studyNums','lesson'];

/* ================= Session composer ================= */
// Rule: nothing is ever recalled before it has been studied. New things get a study card first;
// their first recall comes at the end of the same session.
function dueCards(){const t=today();return S.cards.filter(c=>c.due<=t);}
function composeSession(){
  const om=overallMode(),budget={support:12,steady:18,stretch:24}[om];
  const profs={};for(const k in SKILLS)profs[k]=profile(k);
  const head=[],learn=[],recall=[],fresh=[],notes=[];
  // 1. next lesson (learning always comes before practice)
  const next=LESSONS.find(l=>!S.lessonsDone[l.id]);
  const teach=next&&(om==='stretch'||Object.keys(S.lessonsDone).length<3)?next:null;
  const firstDay=teach&&teach.id==='vivid'&&!S.starterDone;
  if(firstDay)head.push({type:'msg',text:'Welcome! Today you’ll learn one simple trick, use it on 5 everyday things, then see how many you remember. You will never be tested on anything you haven’t been shown first.'});
  if(teach)learn.push({type:'lesson',lesson:teach.id});
  const majorReady=numsUnlocked()||(teach&&teach.id==='major');
  const has={names:S.cards.some(c=>c.deck==='names'&&c.seen),palace:S.palaces.some(p=>p.loci.some(l=>l.item&&l.seen)),numbers:numsUnlocked()&&learnedNums().length>0,dates:!!S.lessonsDone.dates&&numsUnlocked()&&learnedNums().length>0};
  // 2. gentle warm-up for weak skills, using things already learned
  const weak=Object.values(profs).filter(p=>p.mode==='support'&&has[p.skill]);
  if(weak.length){head.push({type:'msg',text:ENCOURAGE[rnd(ENCOURAGE.length)]});
    for(const p of weak){head.push({type:'example',lesson:SKILL_LESSON[p.skill]});notes.push(`${SKILLS[p.skill]}: easy start + worked example (${p.why.split(',')[0]}).`);}
    if(has.numbers){const easy=learnedNums().slice(0,10);for(let i=0;i<2;i++)head.push({type:'num',n:easy[rnd(easy.length)],hint:true,warm:true});}}
  // 3. study new things
  if(firstDay){ensureStarter().forEach(id=>learn.push({type:'study',id}));}
  const newCap={support:3,steady:5,stretch:8}[om];
  const dl=activeDeadlines(),dlSet=new Set();dl.forEach(g=>groupCards(g.tag).forEach(c=>{if(c.deck!=='numbers'||majorReady)dlSet.add(c);}));
  const dlUnseen=[...dlSet].filter(c=>!c.seen&&c.deck!=='everyday').slice(0,10);
  const unseen=[...dlUnseen,...S.cards.filter(c=>!c.seen&&!dlSet.has(c)&&c.deck!=='palace'&&c.deck!=='everyday'&&(c.deck!=='numbers'||majorReady))].slice(0,Math.max(newCap,dlUnseen.length));
  dl.forEach(g=>{const d=dayNum(g.target)-today();notes.push(`“${g.tag}”: ${d} day${d===1?'':'s'} to go — these people come first today (${readiness(g.tag)}% ready).`);});
  unseen.forEach(c=>{learn.push({type:'study',id:c.id});fresh.push({type:'review',id:c.id,fresh:true});});
  let nl=0;S.palaces.forEach(p=>p.loci.forEach((l,i)=>{if(l.item&&!l.seen&&nl<newCap){nl++;learn.push({type:'studyLocus',pid:p.id,i});fresh.push({type:'locus',pid:p.id,i,fresh:true});}}));
  if(majorReady){const np=params('numbers').newItems,haveNums=new Set(S.cards.filter(c=>c.deck==='numbers').map(c=>c.front));
    const newNums=[];for(let i=0;i<100&&newNums.length<np;i++){const k=pad2(i);if(!haveNums.has(k))newNums.push(k);}
    if(newNums.length){learn.push({type:'learnNums',nums:newNums});shuffle(newNums).slice(0,3).forEach(n=>fresh.push({type:'num',n,hint:true,fresh:true}));}}
  if(firstDay){fresh.push({type:'msg',text:'Nice work. Now look away from the screen and slowly count back from 10. Then tap the button and we’ll see what stuck.',btn:'Ready to remember'},{type:'listRecall',ids:ensureStarter()});}
  // 4. due reviews (only things already studied), weak skills first
  const weight=k=>!k?1:profs[k].mode==='support'?0:profs[k].mode==='steady'?1:2;
  const due=dueCards().filter(c=>c.seen&&!unseen.includes(c)&&(c.deck!=='numbers'||numsUnlocked())&&(c.deck!=='palace'||S.palaces.some(p=>p.loci.some(l=>l.id===c.extra.locus&&l.seen)))).sort((a,b)=>weight(skillOf(a))-weight(skillOf(b))||a.ef-b.ef);
  const dlRev=[...dlSet].filter(c=>c.seen&&!unseen.includes(c)&&((c.revs||0)+(c.prac||0))<3&&c.lastRev!==today());
  const reviewCap=Math.max(Math.round(budget*0.6),dlRev.length);[...dlRev,...due.filter(c=>!dlRev.includes(c))].slice(0,reviewCap).forEach(c=>recall.push({type:'review',id:c.id,dl:dlRev.includes(c)}));
  if(due.length>reviewCap)notes.push(`${due.length-reviewCap} reviews held over to keep today to about ${S.settings.minutes} minutes.`);
  // 5. drills, weighted toward weak skills, on learned material only
  const ks=['numbers','dates','palace'].filter(k=>has[k]);
  if(ks.length){const remaining=Math.max(4,budget-recall.length-fresh.length-learn.length);
    const w=ks.map(k=>{const p=profs[k];return 0.5+(p.acc==null?0.5:(1-p.acc))*2+(p.mode==='support'?1:0);}),tot=w.reduce((a,b)=>a+b,0);
    ks.forEach((k,i)=>{let n=Math.max(1,Math.round(remaining*w[i]/tot));n=Math.min(n,params(k).drillCount+2);
      if(k==='palace')palaceTasks(n).forEach(t=>recall.push(t));
      else for(let j=0;j<n;j++){const t=k==='numbers'?numberTask():dateTask();if(t)recall.push(t);}});}
  // confidence win from strongest skill
  const strong=Object.values(profs).filter(p=>p.n>=6&&has[p.skill]).sort((a,b)=>(b.acc||0)-(a.acc||0))[0];
  if(strong&&strong.mode!=='support'){let t=null;if(strong.skill==='numbers'){t=numberTask();if(t)t={type:'num',n:t.n||t.a,win:true};}
    else if(strong.skill==='dates'){t=dateTask();if(t)t={...t,win:true};}
    else if(strong.skill==='palace'){t=palaceTasks(1)[0];if(t)t={...t,win:true};}
    else if(strong.skill==='names'){const nc=S.cards.filter(c=>c.deck==='names'&&c.reps>0&&c.seen).sort((a,b)=>b.ef-a.ef)[0];if(nc&&!recall.some(x=>x.id===nc.id))t={type:'review',id:nc.id,win:true};}
    if(t)recall.push(t);}
  Object.values(profs).forEach(p=>{if(p.mode==='stretch'&&has[p.skill])notes.push(`${SKILLS[p.skill]}: faster pace — ${PRAISE[rnd(PRAISE.length)]}`);});
  const locus=recall.filter(t=>t.type==='locus'),dlr=recall.filter(t=>t.dl),other=shuffle(recall.filter(t=>t.type!=='locus'&&!t.dl));
  const tasks=[...head,...learn,...dlr,...other.slice(0,Math.ceil(other.length/2)),...locus,...other.slice(Math.ceil(other.length/2)),...fresh];
  const empty=!tasks.some(t=>RECALL_TYPES.includes(t.type)||STUDY_TYPES.includes(t.type));
  return {mode:om,tasks:empty?[]:tasks,notes,empty};
}
function bumpStreak(){const t=today(),st=S.streak;if(st.last===t)return;
  st.count=(st.last===t-1)?st.count+1:1;st.last=t;st.best=Math.max(st.best,st.count);}

function parseTags(s){return [...new Set(String(s||'').split(',').map(x=>x.trim()).filter(Boolean))];}
function tagsOf(c){return (c&&c.extra&&c.extra.tags)||[];}
const tagEq=(a,b)=>norm(a)===norm(b);
function allTags(){const m={};const add=(t,k)=>{const key=Object.keys(m).find(x=>tagEq(x,t))||t;m[key]=(m[key]||0)+k;};
  S.cards.forEach(c=>tagsOf(c).forEach(t=>add(t,1)));S.palaces.forEach(p=>(p.tags||[]).forEach(t=>add(t,p.loci.filter(l=>l.item).length)));
  S.groups.forEach(g=>{if(!Object.keys(m).some(x=>tagEq(x,g.tag)))m[g.tag]=0;});return m;}
function groupCards(tag){return S.cards.filter(c=>c.deck!=='palace'&&tagsOf(c).some(t=>tagEq(t,tag)));}
// readiness: each item counts 0 until studied, then 1/3 per review (normal or rehearsal), capped at 3
function itemReady(c){return c.seen?Math.min(3,(c.revs||0)+(c.prac||0))/3:0;}
function readiness(tag){const cs=groupCards(tag);if(!cs.length)return 0;return Math.round(100*cs.reduce((s,c)=>s+itemReady(c),0)/cs.length);}
function dayNum(str){const [y,m,d]=String(str).split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);}
function activeDeadlines(){const t=today();return S.groups.filter(g=>g.target&&dayNum(g.target)>=t).sort((a,b)=>a.target.localeCompare(b.target));}
const practicing=()=>!!(session&&session.practice);
function rehearsalTasks(tag){const study=[],rec=[];
  groupCards(tag).forEach(c=>{if(c.deck==='numbers'&&!numsUnlocked())return;if(!c.seen)study.push({type:'study',id:c.id});rec.push({type:'review',id:c.id,fresh:true});});
  S.palaces.filter(p=>(p.tags||[]).some(t=>tagEq(t,tag))).forEach(p=>p.loci.forEach((l,i)=>{if(!l.item)return;if(!l.seen)study.push({type:'studyLocus',pid:p.id,i});rec.push({type:'locus',pid:p.id,i});}));
  if(!rec.length)return [];
  return [...study,...(study.length?[{type:'msg',text:'Now let’s see what stuck.',btn:'Start recalling'}]:[]),...shuffle(rec)];}
function startRehearsal(tag,back){const tasks=rehearsalTasks(tag);if(!tasks.length)return alert('Nothing in “'+tag+'” yet. Add some people or items to this group first.');
  startSession({mode:'steady',practice:true,tag,back:back||'today',tasks,notes:[]});}

const SRec=typeof window!=='undefined'?(window.SpeechRecognition||window.webkitSpeechRecognition||null):null;
function say(text){if(!TTS||!text)return;try{const ss=window.speechSynthesis;ss.cancel();const u=new window.SpeechSynthesisUtterance(text);const vs=(ss.getVoices&&ss.getVoices())||[];
  const v=vs.find(v=>/en[-_]AU/i.test(v.lang))||vs.find(v=>/^en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;u.lang=v?v.lang:'en-AU';u.rate=0.95;ss.speak(u);}catch(e){}}
function readText(el){return [...el.querySelectorAll('.pill,.prompt,h3,.big,.mid,.msg,li')].filter(n=>!n.closest('.hide')&&!n.closest('#qht')).map(n=>n.textContent.trim()).filter(Boolean).join('. ');}

function renderSession(){
  const s=session;if(s.i>=s.tasks.length)return finishSession();
  const t=s.tasks[s.i],pct=Math.round(100*s.i/s.tasks.length),mins=Math.floor((NOW()-s.start)/6e4);
  const head=`<div class="row mut"><span class="grow">${s.practice?'🔁 Practice only · ':''}Step ${s.i+1} of ${s.tasks.length} · ${mins} min</span><button class="ghost small" id="endnow">Finish for now</button></div><div class="bar"><i style="width:${pct}%"></i></div>`;
  app.innerHTML=head+`<div class="card" id="task" data-type="${t.type}"></div>`;
  app.querySelector('#endnow').onclick=()=>{s.i=s.tasks.length;render();};
  TASKS[t.type](app.querySelector('#task'),t,()=>{s.i++;render();window.scrollTo(0,0);});
  if(session===s&&s.tasks[s.i]===t)addSpeech(app.querySelector('#task'),t);
}
// Skip / Show me helpers: send an item back to study and try it again later. Nothing is recorded.
function backToStudy(t,studyTask,next){if(session){const s=session;const again=t.requeued?[]:[{...t,requeued:true,fresh:true,hint:true}];
    s.tasks.splice(s.i+1,0,studyTask);s.tasks.push(...again);}
  else if(studyTask){const el=app.querySelector('#task');if(el){TASKS[studyTask.type](el,studyTask,next);return;}}
  next();}
function tryLater(t){if(session&&!t.requeued)session.tasks.push({...t,requeued:true,hint:true});}
function finishSession(){

    app.querySelector('#done').onclick=()=>{const b=s.back||'today';go(b);if(b==='people'){ui={sub:'groups'};render();}};app.querySelector('#again').onclick=()=>startRehearsal(s.tag,s.back);nav();return;}
  bumpStreak();const changes=applyAdaptation();
  S.sessions.push({t:NOW(),n,ok,mins:Math.round((NOW()-s.start)/6e4)});S.sessions=S.sessions.slice(-120);save();
  const msg=n&&ok/n<0.7?ENCOURAGE[rnd(ENCOURAGE.length)]:PRAISE[rnd(PRAISE.length)];
  app.innerHTML=`<div class="card"><h2>All done for now 🔥 ${S.streak.count}</h2><p class="mid">${n?ok+' of '+n+' remembered':'Nice — you studied something new today.'}</p><div class="msg">${esc(msg)}</div>
  ${changes.length?'<h3>What changed</h3><ul class="clean">'+changes.map(c=>`<li><b>${SKILLS[c.k]}</b><br><span class="mut">${esc(c.t)}</span></li>`).join('')+'</ul>':''}

  <p class="mut">Session complete. Come back tomorrow — the app will bring things back just before you’d forget them.</p>
  <button class="xl" id="done">Back to Today</button><button class="xl sec" data-go="progress">See progress</button></div>`;

  bindHelpers(el,{hint:L.image||('Starts with “'+L.item.charAt(0)+'”'),show:()=>reveal(true),skip:()=>{L.seen=false;save();backToStudy(t,{type:'studyLocus',pid:t.pid,i:t.i},next);}});},
 listRecall(el,t,next){const cs=t.ids.map(id=>S.cards.find(c=>c.id===id)).filter(Boolean);if(!cs.length)return next();
  if(cs.some(c=>!c.seen)&&session){session.tasks.splice(session.i+1,0,...cs.filter(c=>!c.seen).map(c=>({type:'study',id:c.id})));if(!t.requeued)session.tasks.push({...t,requeued:true});return next();}
  const el2=timer();
  el.innerHTML=`<p class="pill">Remember · starter list</p><p class="prompt">Type the ${cs.length} things from your list — one in each box, in any order. Then tap Check.</p>${cs.map((c,i)=>`<label>Thing ${i+1}</label><input data-i="${i}" placeholder="Type thing ${i+1}" autocomplete="off" autocapitalize="none">`).join('')}<button class="xl" id="c">Check</button>${helpers('First letters: '+cs.map(c=>c.back.charAt(0)).join(', '))}<div id="b"></div>`;
  const nm=s=>norm(s).replace(/s$/,'');
  el.querySelector('#c').onclick=()=>{const ms=el2(),typed=[...el.querySelectorAll('input')].map(i=>nm(i.value)).filter(Boolean);let got=0;
    const rows=cs.map(c=>{const ok=typed.includes(nm(c.back));if(ok)got++;sm2(c,ok?4:1,1);c.seen=true;if(session)session.results.push({skill:null,ok});return `<li>${ok?'✓':'✗'} <b>${esc(c.back)}</b> <span class="mut">— ${esc(c.hint)}</span></li>`;});
    S.starterDone=true;save();el.querySelector('#c').remove();hideHelpers(el);
    el.querySelector('#b').innerHTML=`<p class="mid ${got>=3?'ok':''}">You remembered ${got} of ${cs.length}! ${got>=4?'🎉':''}</p><ul class="clean">${rows.join('')}</ul><p class="mut">${got===cs.length?'That’s the power of vivid pictures.':'Any you missed come back tomorrow — that’s how the app works.'}</p><button class="xl" id="nx">Next</button>`;
    el.querySelector('#nx').onclick=next;};
  bindHelpers(el,{hint:'First letters: '+cs.map(c=>c.back.charAt(0)).join(', '),
    show:()=>{el.querySelector('#c').remove();hideHelpers(el);tryLater(t);el.querySelector('#b').innerHTML=`<ul class="clean">${cs.map(c=>`<li><b>${esc(c.back)}</b> <span class="mut">— ${esc(c.hint)}</span></li>`).join('')}</ul><p class="mut">Have a good look. We’ll try again in a moment.</p><button class="xl" id="nx">Next</button>`;el.querySelector('#nx').onclick=next;},
    skip:()=>{cs.forEach(c=>c.seen=false);save();if(session){session.tasks.splice(session.i+1,0,...cs.map(c=>({type:'study',id:c.id})));if(!t.requeued)session.tasks.push({...t,requeued:true});}next();}});}
};

/* ---------- People ---------- */
function resizePhoto(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=200,c=document.createElement('canvas'),k=Math.min(1,s/Math.max(img.width,img.height));c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.7));};img.src=r.result;};r.readAsDataURL(file);}
const CHECKS=[['said','Said it back'],['used','Used it in conversation'],['ended','Ended with it']];
function addPerson(name,where,more){const extra={where:where||'',feature:'',hook:'',photo:'',ask:'',why:'',tags:[],check:{},...(more||{})};
  const c=newCard('names',extra.feature||extra.where||'?',name,{...extra,hint:extra.hook});S.cards.push(c);return c;}
function importGroupLines(tag,txt){let n=0;String(txt||'').split('\n').forEach(line=>{line=line.trim();if(!line)return;const [name,notes]=line.split('::').map(s=>(s||'').trim());if(!name)return;addPerson(name,notes||'',{tags:tag?[tag]:[]});n++;});return n;}
function tagPills(tags){return (tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join(' ');}
function peopleTabs(sub){return `<h2>Names & faces</h2><div class="row">${[['list','People'],['groups','Groups & dates'],['timed','⏱ Timed round']].map(t=>`<button class="small ${sub===t[0]?'':'sec'}" data-psub="${t[0]}">${t[1]}</button>`).join('')}</div>`;}

      tr.score=score;tr.ms=ms;tr.phase='done';const best=Math.max(0,...S.timedLog.filter(l=>l.n===items.length).map(l=>l.score));tr.best=best;S.timedLog.push({t:NOW(),n:items.length,score,ms,tag:tr.tag||''});S.timedLog=S.timedLog.slice(-50);save();render();};

}

  let body='';
  if(sub==='convert')body=`<div class="card"><h3>Number → images</h3><input id="nn" inputmode="numeric" placeholder="e.g. 0427 555 123"><div id="out"></div></div><div class="card"><h3>Key</h3><table>${MAJOR_KEY.map(k=>`<tr><td><b>${k[0]}</b></td><td>${k[1]}</td></tr>`).join('')}</table></div>`;
  if(sub==='dates')body=`<div class="card"><h3>Date / time → images</h3><label>What happens</label><input id="ev" placeholder="e.g. Dentist appointment"><label>Date</label><input type="date" id="dd"><label>Time (optional)</label><input type="time" id="tt"><label>Group (optional)</label><input id="dtag" placeholder="e.g. Appointments"><div id="dout"></div><button id="dadd" style="margin-top:8px">Add to review deck</button></div>`;
  if(sub==='drill')body=`<div class="card" id="task"></div>`;
  if(sub==='list')body=`<div class="card"><p class="mut">One word per line, 00 to 99. Pick nouns you can see and touch. Changes apply everywhere.</p><textarea id="ml" style="min-height:300px">${[...Array(100).keys()].map(i=>pad2(i)+' '+S.major[pad2(i)]).join('\n')}</textarea><div id="mlw" class="mut"></div><button id="msv">Save list</button></div>`;
  app.innerHTML=`<h2>Numbers, dates & times</h2>${tabs}${body}`;
  app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{ui.sub=b.dataset.sub;render();});
  if(sub==='convert'){const i=app.querySelector('#nn');i.oninput=()=>{app.querySelector('#out').innerHTML='<ul class="clean">'+numberToWords(i.value).map(c=>`<li><b>${c.c}</b> → ${esc(c.w)}</li>`).join('')+'</ul>';};}
  if(sub==='dates'){const upd=()=>{const ch=dateToChunks(app.querySelector('#dd').value,app.querySelector('#tt').value);app.querySelector('#dout').innerHTML='<ul class="clean">'+ch.map(c=>`<li>${c.label} <b>${c.c}</b> → ${esc(c.w)}</li>`).join('')+'</ul>'+(ch.length?`<p class="msg">Scene idea: ${esc(app.querySelector('#ev').value||'the event')} with ${ch.map(c=>'a '+c.w).join(', ')} — all in one picture, placed where it happens.</p>`:'');};
    ['#dd','#tt','#ev'].forEach(s=>app.querySelector(s).oninput=upd);
    app.querySelector('#dadd').onclick=()=>{const ev=app.querySelector('#ev').value.trim(),d=app.querySelector('#dd').value,t=app.querySelector('#tt').value;if(!ev||!d)return alert('Add the event and a date.');
      const [y,m,dd]=d.split('-');const ch=dateToChunks(d,t);S.cards.push(newCard('dates',`When is: ${ev}?`,`${dd}/${m}/${y}${t?' at '+t:''}`,{hint:ch.map(c=>c.w).join(' + '),tags:parseTags(app.querySelector('#dtag').value)}));save();alert('Added.');};}
  if(sub==='drill'){const run=()=>{const t=(Math.random()<0.6?numberTask():dateTask())||numberTask();const el=app.querySelector('#task');if(!t){el.innerHTML='<h3>Nothing to drill yet</h3><p>You haven’t learned any number pictures yet. Do Lesson 6 first, then learn your first pictures.</p><button class="xl" id="gl">Go to Lesson 6</button>';el.querySelector('#gl').onclick=()=>{tab='learn';ui={lesson:'major'};render();};return;}TASKS[t.type](el,t,run);};run();}
  if(sub==='list')app.querySelector('#msv').onclick=()=>{const bad=[];app.querySelector('#ml').value.split('\n').forEach(line=>{const m=line.trim().match(/^(\d\d)\s+(.+)$/);if(m){S.major[m[1]]=m[2].trim();if(majorEncode(m[2])!==m[1])bad.push(m[1]+' '+m[2]);}});save();
    app.querySelector('#mlw').innerHTML=bad.length?'Saved. These may not follow the sounds (the checker is approximate, so silent letters can fool it): '+esc(bad.join(', ')):'Saved ✓';};

/* ---------- Progress ---------- */
VIEWS.progress=function(){

   <div class="bar" style="margin:6px 0"><i style="width:${p.level*20}%"></i></div><p class="mut">Now: ${esc(levelDesc(k,p.level))}</p><p>${esc(p.why)}</p></div>`;}).join('');

  <div class="card"><h3>Recent adjustments</h3><ul class="clean">${S.adaptLog.slice(0,10).map(a=>`<li><b>${esc(SKILLS[a.skill]||'')}</b> <span class="mut">${new Date(a.t).toLocaleDateString()}</span><br>${esc(a.text)}</li>`).join('')||'<li class="mut">None yet. Levels change after about 10 answers in a skill.</li>'}</ul></div>`;

/* ---------- More: backup, import, settings ---------- */
VIEWS.more=function(){
  app.innerHTML=`<h2>Backup & settings</h2><button class="xl sec" data-go="help">Help & instructions</button>
  <div class="card"><h3>Backup</h3><p class="mut">Everything lives only in this browser. Export weekly and keep the file in Dropbox/Drive.${S.lastBackup?' Last export: '+new Date(S.lastBackup).toLocaleDateString():''}</p><div class="row"><button id="ex">Export JSON</button><label class="btn sec" style="margin:0;color:var(--ink)">Import JSON<input type="file" id="im" accept=".json,application/json" class="hide"></label></div></div>
  <div class="card"><h3>Import cards from notes (e.g. Obsidian)</h3><p class="mut">One per line: <code>front :: back</code>. Start a line with <code>#names</code>, <code>#dates</code>, <code>#palace</code> or <code>#numbers</code> to set the deck for the lines after it. For #names use <code>Name :: where met :: feature :: hook</code>. A line like <code>@Book club</code> puts the lines after it in that group.</p><textarea id="tx"></textarea><button id="ti">Import lines</button></div>
  <div class="card"><h3>Settings</h3><label>Daily session length (minutes)</label><select id="mn">${[5,10,15,20].map(m=>`<option ${S.settings.minutes==m?'selected':''}>${m}</option>`).join('')}</select><button class="sec" id="rs" style="margin-top:12px">Reset everything</button></div>
  <p class="mut">Free, offline, private. Not affiliated with any commercial memory app.</p>`;
  app.querySelector('#ex').onclick=()=>{S.lastBackup=NOW();save();const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='memory-trainer-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();};
  app.querySelector('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cards||!d.skills)throw 0;if(confirm('Replace current data with this backup?')){localStorage.setItem(KEY,JSON.stringify(d));load();alert('Restored.');go('today');}}catch(x){alert('That file is not a Memory Trainer backup.');}};r.readAsText(f);};
  app.querySelector('#ti').onclick=()=>{const n=importLines(app.querySelector('#tx').value);save();alert(n+' cards imported.');};
  app.querySelector('#mn').onchange=e=>{S.settings.minutes=+e.target.value;save();};
  app.querySelector('#rs').onclick=()=>{if(confirm('Delete ALL data on this phone? Export first if unsure.')){S=freshState();save();go('today');}};
  bindGo();
};
function importLines(txt){let deck='custom',n=0,itag='';txt.split('\n').forEach(line=>{line=line.trim();const g=line.match(/^@(.+)$/);if(g){itag=g[1].trim();return;}const tag=line.match(/^#(names|dates|palace|numbers|custom)\b/i);if(tag){deck=tag[1].toLowerCase();return;}
  const parts=line.split('::').map(s=>s.trim());if(parts.length<2||!parts[0])return;
  if(deck==='names')S.cards.push(newCard('names',parts[2]||parts[1],parts[0],{where:parts[1]||'',feature:parts[2]||'',hook:parts[3]||'',hint:parts[3]||'',tags:itag?[itag]:[],check:{}}));
  else S.cards.push(newCard(deck==='custom'?'dates':deck,parts[0],parts[1],{tags:itag?[itag]:[]}));n++;});return n;}
